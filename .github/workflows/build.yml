name: Build

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
      
      - name: Clean old builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          rm -rf *.cs3 *.jar plugins.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Clean Gradle caches
        run: |
          cd $GITHUB_WORKSPACE/src
          echo "Removing Gradle caches..."
          rm -rf ~/.gradle/caches
          rm -rf .gradle
          rm -rf build
          rm -rf SafakStreamCinema/build
          echo "Caches cleared"

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          echo "=== STEP 1: Running gradlew clean make makePluginsJson ==="
          ./gradlew clean make makePluginsJson
          echo "=== STEP 2: Listing all .cs3 files ==="
          find . -name "*.cs3" -type f 2>/dev/null || echo "No .cs3 found"
          echo "=== STEP 3: Listing all plugins.json files ==="
          find . -name "plugins.json" -type f 2>/dev/null || echo "No plugins.json found"
          echo "=== STEP 4: Content of plugins.json (first 500 chars) ==="
          for f in $(find . -name "plugins.json" -type f 2>/dev/null); do
            echo "--- $f ---"
            head -c 500 "$f"
            echo ""
          done
          ./gradlew ensureJarCompatibility
          echo "=== STEP 5: Copying .cs3 files ==="
          cp -f **/build/*.cs3 $GITHUB_WORKSPACE/builds/ || true
          ls -la $GITHUB_WORKSPACE/builds/*.cs3 2>/dev/null || echo "No .cs3 copied"
          echo "=== STEP 6: Copying plugins.json ==="
          cp -f build/plugins.json $GITHUB_WORKSPACE/builds/plugins.json || true
          ls -la $GITHUB_WORKSPACE/builds/plugins.json 2>/dev/null || echo "No plugins.json copied"

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          git commit -m "Update builds" || exit 0
          git push --force origin builds
