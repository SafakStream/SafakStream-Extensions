name: Kreosus Destekci Sayisini Guncelle

on:
  schedule:
    - cron: '0 0 * * *' # Her gün gece 00:00'da çalışır
  workflow_dispatch: # Manuel de çalıştırabilmek için

jobs:
  update-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Gerekli Kütüphaneleri Yükle
        run: pip install requests beautifulsoup4

      - name: Kreosus Sayfasını Oku ve Güncelle
        run: |
          python - << 'EOF'
          import requests
          from bs4 import BeautifulSoup
          import re

          # Kreosus sayfanın URL'si
          url = "https://kreosus.com/safakstream"
          headers = {'User-Agent': 'Mozilla/5.0'}
          response = requests.get(url, headers=headers)
          
          if response.status_code == 200:
              soup = BeautifulSoup(response.text, 'html.parser')
              
              # "X / 20 destekçi" yazısını bul
              text = soup.get_text()
              match = re.search(r'(\d+)\s*/\s*20\s*destekçi', text, re.IGNORECASE)
              
              if match:
                  destekci_sayisi = match.group(1)
                  print(f"Bulunan destekçi sayısı: {destekci_sayisi}")
                  
                  # index.html dosyasını oku
                  with open('index.html', 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  # Eski bar kısmını yeni sayıyla değiştir
                  content = re.sub(r'\d+\s*/\s*20\s*Destekçi', f'{destekci_sayisi} / 20 Destekçi', content)
                  
                  # Barın genişliğini (yüzdesini) güncelle
                  yuzde = min(100, int(destekci_sayisi) * 5) # Her destekçi %5
                  content = re.sub(r'width:\s*\d+%;', f'width: {yuzde}%;', content)
                  
                  with open('index.html', 'w', encoding='utf-8') as f:
                      f.write(content)
                  
                  print("index.html güncellendi!")
              else:
                  print("Destekçi sayısı bulunamadı.")
          else:
              print(f"Sayfa yüklenemedi: {response.status_code}")
          EOF

      - name: Değişiklikleri Kaydet ve Gönder
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add index.html
          git commit -m "chore: Destekci sayisi otomatik guncellendi" || echo "Değişiklik yok"
          git push
