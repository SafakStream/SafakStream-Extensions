name: Kreosus Destekci Sayisini Guncelle

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Gerekli Kütüphaneleri Yükle
        run: pip install requests beautifulsoup4

      - name: Kreosus Sayfasini Oku ve Guncelle
        run: |
          python - << 'EOF'
          import requests
          from bs4 import BeautifulSoup
          import re

          url = "https://kreosus.com/safakstream"
          headers = {'User-Agent': 'Mozilla/5.0'}
          response = requests.get(url, headers=headers)
          
          if response.status_code == 200:
              soup = BeautifulSoup(response.text, 'html.parser')
              text = soup.get_text()
              
              match = re.search(r'(\d+)\s*/\s*20\s*supporters', text, re.IGNORECASE)
              
              if match:
                  destekci_sayisi = match.group(1)
                  print(f"Bulunan destekci sayisi: {destekci_sayisi}")
                  
                  with open('index.html', 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  # SADECE gizli div icindeki sayiyi degistir. Baska hicbir yere dokunma!
                  content = re.sub(r'(<div id="bot-verisi" style="display: none;">)\d+(</div>)', rf'\g<1>{destekci_sayisi}\g<2>', content)
                  
                  with open('index.html', 'w', encoding='utf-8') as f:
                      f.write(content)
                  
                  print("Gizli sayi basariyla guncellendi!")
              else:
                  print("Destekci sayisi bulunamadi.")
          else:
              print(f"Sayfa yuklenemedi: {response.status_code}")
          EOF

      - name: Degisiklikleri Kaydet ve Gonder
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add index.html
          git commit -m "chore: Destekci sayisi otomatik guncellendi" || echo "Degisiklik yok"
          git push
