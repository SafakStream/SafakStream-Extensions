name: Kreosus Destekci Sayisini Guncelle

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Gerekli Kütüphaneleri Yükle
        run: pip install requests beautifulsoup4

      - name: Kreosus Sayfasini Oku ve Guncelle
        run: |
          python - << 'PYTHON_EOF'
          import requests
          from bs4 import BeautifulSoup
          import re

          url = "https://kreosus.com/safakstream"
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
          response = requests.get(url, headers=headers)
          
          if response.status_code == 200:
              soup = BeautifulSoup(response.text, 'html.parser')
              
              # Sayfadaki tüm metni al
              text = soup.get_text(separator=' ')
              
              # "X / 20" formatını ara (destekçi veya supporters kelimesi olmasa bile)
              # \d+ -> rakamları, \s* -> boşlukları, / 20 -> sabit kısmı temsil eder
              match = re.search(r'(\d+)\s*/\s*20', text)
              
              if match:
                  destekci_sayisi = match.group(1)
                  print(f"Bulunan destekci sayisi: {destekci_sayisi}")
                  
                  with open('index.html', 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  # Sadece gizli div icindeki sayiyi degistir
                  content = re.sub(r'(<div id="bot-verisi" style="display: none;">)\d+(</div>)', rf'\g<1>{destekci_sayisi}\g<2>', content)
                  
                  with open('index.html', 'w', encoding='utf-8') as f:
                      f.write(content)
                  
                  print("index.html basariyla guncellendi!")
              else:
                  # Eger bulamazsa, sayfanin o kismini print et ki neyi kacirdigimizi gorelim
                  print("HATA: 'X / 20' formati bulunamadi. Sayfadaki ilgili kisim:")
                  # Sadece '20' gecen yerleri yazdir
                  for line in text.split('\n'):
                      if '20' in line:
                          print(line.strip())
          else:
              print(f"Sayfa yuklenemedi: {response.status_code}")
          PYTHON_EOF

      - name: Degisiklikleri Kaydet ve Gonder
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add index.html
          git commit -m "chore: Destekci sayisi otomatik guncellendi" || echo "Degisiklik yok"
          git push
